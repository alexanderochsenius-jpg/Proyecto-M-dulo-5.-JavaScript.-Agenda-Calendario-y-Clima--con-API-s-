<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Interactiva · Clima y Calendario</title>
    <style>
        /* ---------- Estilos generales (mismos que en los otros archivos) ---------- */
        @import url('https://fonts.googleapis.com/css?family=Dancing+Script:wght@600&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background: url('https://www.greenpeace.org/static/planet4-chile-stateless/2023/05/7376c8c3-glaciar-ventisquero-colgante-queulat.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 0;
        }

        .container {
            position: relative;
            background: #4dd0e1;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 90%;
            max-width: 500px;
            z-index: 1;
        }

        h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 28px;
        }
        .text-blue { color: #1565c0; }
        .text-red { color: #d32f2f; }

        .menu-descripcion {
            margin: 10px 0 20px;
            font-size: 16px;
            color: #1b3b3a;
        }

        .menu-botones {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin: 20px 0 10px;
        }

        .menu-boton {
            display: block;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 14px 20px;
            border-radius: 8px;
            transition: background 0.2s, transform 0.1s;
            border: 2px solid transparent;
        }

        .menu-boton:hover {
            background: #1b5e20;
            transform: scale(1.02);
        }

        .menu-boton:active,
        .menu-boton:focus {
            outline: none;
            border-color: #d32f2f;
            transform: scale(1.04);
        }

        /* ---------- Firma (igual que en los otros) ---------- */
        .caja-firma {
            margin-top: 25px;
        }
        .firma-copyright {
            font-family: 'Dancing Script', cursive !important;
            font-size: 11px !important;
            color: #ff69b4 !important;
            background-color: #000000 !important;
            padding: 8px 15px !important;
            border-radius: 8px !important;
            text-align: center;
            line-height: 1.4;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 450px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 22px; }
            .menu-boton { font-size: 16px; padding: 12px 16px; }
        }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="container">
        <!-- Título principal -->
        <h1>
            <span class="text-blue">Agenda</span>
            <span class="text-red">Interactiva</span>
        </h1>
        <p class="menu-descripcion">
            🌦️ Consulta el clima o gestiona tu calendario con agenda personal.
        </p>

        <!-- Botones de acceso -->
        <div class="menu-botones">
            <a href="index.html" class="menu-boton">🌤️ Clima Chile</a>
            <a href="calendario.html" class="menu-boton">📅 Calendario y Agenda</a>
        </div>

        <!-- Firma del desarrollador -->
        <div class="caja-firma">
            <div class="firma-copyright">
                2026 Agosto · Alexander Wolfgang Ochsenius Geis · con asistencia de IA
            </div>
        </div>
    </div>

</body>
</html>
